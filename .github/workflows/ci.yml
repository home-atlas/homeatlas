name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  deploy-tools:
    name: Deployment safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make test-deploy
      - run: bash -n deploy/proxmox/install.sh
      - run: shellcheck deploy/proxmox/install.sh
      - run: sudo install -D /usr/bin/true /opt/homeatlas/current/homeatlas
      - run: systemd-analyze verify deploy/proxmox/homeatlas.service

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test-web

  verify:
    name: Critical Go tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Critical security and data flows
        run: make test-ci
      # Build assets here too so the production binary embeds the verified sources.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - name: Build Linux amd64 executable
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -tags production -o bin/homeatlas ./cmd/homeatlas
      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          make plugin-documents PACKAGE_OUT=dist/documents.hap
          cp bin/homeatlas dist/homeatlas
          cd dist
          sha256sum homeatlas documents.hap > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: homeatlas-release
          path: dist/
          if-no-files-found: error

  release:
    needs: [deploy-tools, web, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homeatlas-release
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish release (tags containing a dash are prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${args[@]}" \
            dist/homeatlas dist/documents.hap dist/SHA256SUMS

  deploy:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-lab.yml
    with:
      tag: ${{ github.ref_name }}
