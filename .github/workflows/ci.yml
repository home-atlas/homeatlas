name: CI and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-tools:
    name: Deployment safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: make test-deploy
      - run: bash -n deploy/proxmox/install.sh
      - run: shellcheck deploy/proxmox/install.sh
      - run: sudo install -D /usr/bin/true /opt/homeatlas/current/homeatlas
      - run: systemd-analyze verify deploy/proxmox/homeatlas.service

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test-web

  verify:
    name: Critical Go tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Critical security and data flows
        run: make test-ci
      # Build assets here too so the production binary embeds the verified sources.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - name: Build Linux amd64 executable
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -tags production -o bin/homeatlas ./cmd/homeatlas
      - name: Package release assets
        id: package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          printf 'tag=v%s-lab.%s\n' "$(node -p 'require("./apps/web/package.json").version')" "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          make plugin-documents PACKAGE_OUT=dist/documents.hap
          cp bin/homeatlas dist/homeatlas
          cd dist
          sha256sum homeatlas documents.hap > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: homeatlas-release
          path: dist/
          if-no-files-found: error

  release:
    needs: [deploy-tools, web, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Download validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name homeatlas-release --dir dist
      - name: Verify release assets
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create tag and publish lab release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --prerelease \
            dist/homeatlas dist/documents.hap dist/SHA256SUMS
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-lab.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
