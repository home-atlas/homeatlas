name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: make test
      - name: Build Linux amd64 and Documents
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 make build
          make plugin-documents PACKAGE_OUT=dist/documents.hap
          cp bin/homeatlas dist/homeatlas
          cd dist
          sha256sum homeatlas documents.hap > SHA256SUMS
      - name: Publish release (tags containing a dash are prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes "${args[@]}" \
            dist/homeatlas dist/documents.hap dist/SHA256SUMS

  deploy:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-lab.yml
    with:
      tag: ${{ github.ref_name }}
